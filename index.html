<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GalleryFahmi</title>
  <meta name="description" content="Galeri foto dengan kategori Photo Random." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0b0c;
      --card: #18181b;
      --text: #ffffff;
      --muted: #b4b4bb;
      --line: rgba(255,255,255,0.08);
      --gold: #d6b36a;
      --gold-soft: #f2deb2;
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
      --container: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #0a0a0b, #111113);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(var(--container), 92%);
      margin: 0 auto;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(14px);
      background: rgba(10, 10, 11, 0.85);
      border-bottom: 1px solid var(--line);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 78px;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .brand span {
      color: var(--gold);
    }

    .section {
      padding: 72px 0;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      text-align: center;
      margin-bottom: 14px;
    }

    .section-desc {
      max-width: 760px;
      margin: 0 auto 34px;
      text-align: center;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .filter-btn {
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      cursor: pointer;
      transition: 0.25s ease;
      font-weight: 600;
      font-size: 0.98rem;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: linear-gradient(135deg, var(--gold), var(--gold-soft));
      color: #1a1408;
      border-color: transparent;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 24px;
      position: relative;
      border: 1px solid var(--line);
      background: var(--card);
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: var(--shadow);
    }

    .gallery-item:hover {
      transform: translateY(-6px);
    }

    .gallery-item img {
      width: 100%;
      height: 460px;
      object-fit: cover;
      transition: 0.35s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.03);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0.08));
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .overlay-content span {
      display: inline-block;
      color: var(--gold);
      font-size: 0.82rem;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .overlay-content h3 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .overlay-content p {
      color: #d7d7db;
      font-size: 0.95rem;
    }

    footer {
      padding: 28px 0 40px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      margin-top: 50px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 24px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 1000px;
      width: 100%;
      position: relative;
    }

    .lightbox img {
      width: 100%;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 16px;
    }

    .lightbox-close {
      position: absolute;
      top: -42px;
      right: 0;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }

    @media (max-width: 992px) {
      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .section {
        padding: 52px 0;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-item img {
        height: 520px;
      }

      .filter-btn {
        padding: 11px 18px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-wrap">
      <a href="#" class="brand">Photo<span>Gallery</span></a>
    </div>
  </header>

  <section class="section" id="galeri">
    <div class="container">
      <h1 class="section-title">Galeri Foto</h1>
      <p class="section-desc">
        Pilih kategori untuk melihat koleksi foto. Semua foto di bawah masuk ke kategori
        <strong>Photo Random</strong>.
      </p>

      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">Semua</button>
        <button class="filter-btn" data-filter="photo-random">Photo Random</button>
      </div>

      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>© 2026 PhotoGallery. All rights reserved.</p>
    </div>
  </footer>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose">&times;</button>
      <img src="" alt="Preview" id="lightboxImg">
    </div>
  </div>

  <script>
    const photoUrls = [
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138876.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138877.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138878.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138879.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138880.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138881.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138882.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138883.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138884.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138885.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138886.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138887.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000051529.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138888.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000051530.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138889.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138890.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138891.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138892.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138893.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138894.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138895.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138896.jpg",

      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138921.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138922.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138923.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138924.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138925.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138926.jpg",
      "https://6a02ede2fc46b5b25f34683a.imgix.net/1000138927.jpg"
    ];

    const galleryGrid = document.getElementById("galleryGrid");

    galleryGrid.innerHTML = photoUrls.map((url, index) => `
      <div class="gallery-item" data-category="photo-random">
        <img src="${url}" alt="Photo Random ${index + 1}">
        <div class="overlay">
          <div class="overlay-content">
            <span>Photo Random</span>
            <h3>Photo Random ${String(index + 1).padStart(2, "0")}</h3>
            <p>Koleksi foto kategori Photo Random.</p>
          </div>
        </div>
      </div>
    `).join("");

    const filterButtons = document.querySelectorAll(".filter-btn");

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        filterButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");

        const filter = button.getAttribute("data-filter");
        const galleryItems = document.querySelectorAll(".gallery-item");

        galleryItems.forEach(item => {
          const category = item.getAttribute("data-category");
          if (filter === "all" || category === filter) {
            item.style.display = "block";
          } else {
            item.style.display = "none";
          }
        });
      });
    });

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxClose = document.getElementById("lightboxClose");

    galleryGrid.addEventListener("click", (e) => {
      const item = e.target.closest(".gallery-item");
      if (!item) return;

      const img = item.querySelector("img");
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add("active");
    });

    lightboxClose.addEventListener("click", () => {
      lightbox.classList.remove("active");
    });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        lightbox.classList.remove("active");
      }
    });
  </script>
</body>
</html>
